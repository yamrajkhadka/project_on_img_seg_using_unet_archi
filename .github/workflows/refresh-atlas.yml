# Keeps the national land-cover atlas current: once a month the "latest high-resolution imagery" epoch is
# re-classified at every atlas site and committed back, which redeploys the Streamlit app automatically.
# Enable it under Settings -> Actions -> General -> Workflow permissions: "Read and write permissions".
name: refresh-atlas

on:
  schedule:
    - cron: "30 2 1 * *"  # 02:30 UTC on the 1st of every month
  workflow_dispatch:
    inputs:
      epochs:
        description: "Epochs to (re)compute, e.g. esri or eox-2026"
        default: "esri"

permissions:
  contents: write

jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Re-classify the atlas sites
        run: python scripts/build_atlas.py --epochs "${{ github.event.inputs.epochs || 'esri' }}" --refresh --workers 6
      - name: Commit the refreshed atlas
        run: |
          git config user.name "monitor-nepal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/atlas
          git diff --cached --quiet || (git commit -m "Refresh national land-cover atlas" && git push)
