# nepalmonitor.yamrajkhadka.com.np on Cloudflare (free plan): static files, served free and without limit; worker.js
# only gives the share image its content type.
# `npm run build` writes out/; .github/workflows/deploy-website.yml rebuilds and deploys it every 3 hours (so the
# live pages stay current) and whenever web/ changes on main. monitornepal. 301s here from the Worker domain-redirects.
# The route nepalmonitor.yamrajkhadka.com.np/* (its DNS record is proxied by Cloudflare) was attached once, outside
# this file: publishing routes from here needs a key with access to every zone, and `wrangler deploy` leaves routes
# that aren't listed here alone. See it under Workers & Pages -> nepalmonitor -> Settings -> Domains & Routes.
name = "nepalmonitor"
account_id = "0f6802281dc6fd8bcd7bf4f780b37a46"
main = "worker.js"
no_bundle = true
find_additional_modules = false # else no_bundle uploads every .js file under web/, node_modules included
compatibility_date = "2026-10-01"
workers_dev = false

[assets]
directory = "./out"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/opengraph-image"]
