[server]
maxUploadSize = 60
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"

[theme]
font = "sans-serif"
baseRadius = "medium"
showSidebarBorder = true

[theme.light]
primaryColor = "#256abf"
backgroundColor = "#fbfbf9"
secondaryBackgroundColor = "#f1f0ec"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"
linkColor = "#1c5cab"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.dark]
primaryColor = "#5598e7"
backgroundColor = "#121211"
secondaryBackgroundColor = "#1d1d1b"
textColor = "#f0efec"
borderColor = "#2c2c2a"
linkColor = "#86b6ef"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]
